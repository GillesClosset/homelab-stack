include:
  - ./supabase/docker/docker-compose.yml

volumes:
  n8n_storage:
  ollama_storage:
#  qdrant_storage:
  open-webui:
  flowise:
  caddy-data:
  caddy-config:
  valkey-data:
  langfuse_postgres_data:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  langfuse_minio_data:
  portainer_data:

  n8n-backup:
  n8n-shared:
#  n8n-fiches:   # still declared here even if it stays a bind mount
  neo4j-logs:
  neo4j-config:
  neo4j-data:
  neo4j-plugins:
  searxng-config:

x-n8n: &service-n8n
  image: n8nio/n8n:2.13.4
  environment:
    - DB_TYPE=postgresdb
    - DB_POSTGRESDB_HOST=supabase-db
    - DB_POSTGRESDB_PORT=5432
    - DB_POSTGRESDB_USER=n8n_user
    - DB_POSTGRESDB_PASSWORD=WOuLSMXH#rXu4G
    - DB_POSTGRESDB_DATABASE=n8n_db
    - N8N_DIAGNOSTICS_ENABLED=false
    - N8N_PERSONALIZATION_ENABLED=false
    - N8N_ENCRYPTION_KEY
    - N8N_USER_MANAGEMENT_JWT_SECRET
    - WEBHOOK_URL=${N8N_HOSTNAME:+https://}${N8N_HOSTNAME:-http://localhost:5678}
    - N8N_FEATURE_FLAGS=communityNodes
    - N8N_ALLOW_LOAD_NODES_FROM_NPM=true
    - GENERIC_TIMEZONE=Europe/Paris
    - N8N_PROTOCOL=https
    - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
    - NODES_EXCLUDE="[]"
    - N8N_RESTRICT_FILE_ACCESS_TO=/home/node/.n8n-files;/files/fiches
    # NEW: Task runners (external mode)
    - N8N_RUNNERS_ENABLED=true
    - N8N_RUNNERS_MODE=external
    - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
    - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}


x-ollama: &service-ollama
  image: ollama/ollama:latest
  container_name: ollama
  restart: unless-stopped
  expose:
    - 11434/tcp
  environment:
    - OLLAMA_CONTEXT_LENGTH=8192
    - OLLAMA_FLASH_ATTENTION=1
    - OLLAMA_KV_CACHE_TYPE=q8_0
    - OLLAMA_MAX_LOADED_MODELS=2
  volumes:
    - ollama_storage:/root/.ollama

x-init-ollama: &init-ollama
  image: ollama/ollama:latest
  container_name: ollama-pull-llama
  volumes:
    - ollama_storage:/root/.ollama
  entrypoint: /bin/sh
  command:
    - "-c"
    - "sleep 3; OLLAMA_HOST=ollama:11434 ollama pull qwen2.5:7b-instruct-q4_K_M; OLLAMA_HOST=ollama:11434 ollama pull nomic-embed-text"

services:
  flowise:
    image: flowiseai/flowise
    restart: unless-stopped
    profiles: ["optional"]
    container_name: flowise
    expose:
      - 3001/tcp
    environment:
        - PORT=3001
        - FLOWISE_USERNAME=${FLOWISE_USERNAME}
        - FLOWISE_PASSWORD=${FLOWISE_PASSWORD}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
        - ~/.flowise:/root/.flowise
    entrypoint: /bin/sh -c "sleep 3; flowise start"

  finance_backend:
    restart: unless-stopped
    build:
      context: ./Finance_dashboard/backend
      dockerfile: Dockerfile
      args:
        PYTHON_ENV: production
    environment:
      - DATABASE_URL=postgresql://supabase_admin:${POSTGRES_PASSWORD}@db:5432/_supabase
      - SECRET_KEY=${FINANCE_SECRET_KEY}
      - APP_PASSWORD=${FINANCE_APP_PASSWORD}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ASSISTANT_ENABLED=${ASSISTANT_ENABLED:-true}
      - ASSISTANT_PROVIDER=${ASSISTANT_PROVIDER:-openai}
      - ASSISTANT_AUTH_MODE=${ASSISTANT_AUTH_MODE:-api_key}
      - ASSISTANT_MODEL=${ASSISTANT_MODEL:-gpt-5-mini}
      - ASSISTANT_DOCUMENT_SEARCH_LIMIT=${ASSISTANT_DOCUMENT_SEARCH_LIMIT:-8}
      - ASSISTANT_DOCUMENT_EXCERPT_CHARS=${ASSISTANT_DOCUMENT_EXCERPT_CHARS:-4000}
#    depends_on:
#      - db
    depends_on:
      db:
        condition: service_healthy
#    volumes:
#      - ./Finance_dashboard/backend:/app # optional, only if you want live code on server

  finance_frontend:
    restart: unless-stopped
    build:
      context: ./Finance_dashboard/frontend
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
        REACT_APP_API_URL: https://finance.chezgilles.ovh
    depends_on:
      - finance_backend

  n8n-import:
    <<: *service-n8n
    container_name: n8n-import
    entrypoint: /bin/sh
    command:
      - "-c"
      - "n8n import:credentials --separate --input=/backup/credentials && n8n import:workflow --separate --input=/backup/workflows"
    volumes:
      - ./n8n/backup:/backup


  n8n:
    <<: *service-n8n
    container_name: n8n
    restart: unless-stopped
    expose:
      - 5678/tcp
      - 5679/tcp  # NEW: Task broker port
    volumes:
      - n8n_storage:/home/node/.n8n
      #- ./n8n/backup:/backup
      #- ./shared:/data/shared
      - /home/gilles/local-ai-packaged/n8n/fiches:/files/fiches
      - n8n-backup:/backup
      - n8n-shared:/data/shared
#    extra_hosts:
#      - "host.docker.internal:host-gateway"

    depends_on:
      n8n-import:
        condition: service_completed_successfully
      db:
        condition: service_healthy

  # NEW: Task runner service
  n8n-task-runner:
    image: n8nio/runners:2.13.4
    container_name: n8n-task-runner
    restart: unless-stopped
    environment:
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n:5679
    volumes:
      - n8n_storage:/home/node/.n8n
    depends_on:
      n8n:
        condition: service_started

 # qdrant:
 #   image: qdrant/qdrant
 #   container_name: qdrant
 #   restart: unless-stopped
 #   expose:
 #     - 6333/tcp
 #     - 6334/tcp
 #   volumes:
 #     - qdrant_storage:/qdrant/storage

  neo4j:
    image: neo4j@sha256:cab98be4bb9ab340885a97f10bab54cf01f931acc63be5bac890304dd13ddec9
    volumes:
      - neo4j-logs:/logs
      - neo4j-config:/config
      - neo4j-data:/data
      - neo4j-plugins:/plugins
      - ./neo4j-certs:/ssl/bolt:ro
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-demodemo}
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1G
      - NEO4J_server_memory_pagecache_size=512m
      
      # Bolt with SSL enabled
      - NEO4J_server_bolt_listen__address=:7687
      - NEO4J_server_bolt_advertised__address=neo4j.chezgilles.ovh:7687
      - NEO4J_server_bolt_tls__level=OPTIONAL
      
      # SSL policy for Bolt
      - NEO4J_dbms_ssl_policy_bolt_enabled=true
      - NEO4J_dbms_ssl_policy_bolt_base__directory=/ssl/bolt
      - NEO4J_dbms_ssl_policy_bolt_private__key=privkey.pem
      - NEO4J_dbms_ssl_policy_bolt_public__certificate=fullchain.pem
      
      # HTTP interface
      - NEO4J_server_http_listen__address=:7474
      - NEO4J_server_https_enabled=false
      
      # APOC plugin configuration
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_refactor_enabled=true
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
    ports:
      - "7687:7687"  # Expose Bolt port
    expose:
      - 7474/tcp
    healthcheck:
      test: ["CMD", "wget", "-O", "/dev/null", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always

